config_version = 13

[bar.default]
capsule_radius = 0
center = []
end = [ "tray", "notifications", "clipboard", "volume", "brightness", "battery", "clock", "session" ]
margin_ends = 0
padding = 23
radius = 0
start = [ "workspaces" ]
thickness = 39

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 803.39996337890625
    output = "eDP-1"
    placement_height = 1040.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.0
font_family = "JetBrainsMono Nerd Font"
panel_anchor_bar = "default"

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    floating_layer = "top"
    floating_offset = 0
    launcher_position = "auto"
    polkit_placement = "attached"

    [shell.screen_corners]
    size = 20

    [shell.screenshot]
    save_to_file = false

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Blue"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme" ]
    community_ids = [ "zen-browser", "fastfetch" ]

[wallpaper]
directory = "/home/kzzzl/Wallpapers"

    [wallpaper.default]
    path = "/home/kzzzl/Wallpapers/dark-forest.jpg"

    [wallpaper.last]
    path = "/home/kzzzl/Wallpapers/dark-forest.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/kzzzl/Wallpapers/dark-forest.jpg"